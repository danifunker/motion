name: Release
# Enable the following for automatic releases on git tags 
  # push:
  #   tags:
  #     - 'v*'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this release, e.g. v0.1.0'
        required: true
        type: string
      publish:
        description: 'Actually create the GitHub Release (leave unticked for a dry run)'
        required: false
        default: false
        type: boolean
      include_roms:
        description: 'Bundle roms/ into the archives - this redistributes SGI firmware'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-universal
            runner: macos-latest
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Keep this list in sync with build.yml. The X11 extension packages are
      # required, not optional - SDL aborts configure if any are missing.
      # Canonical list: external/sdl3/docs/README-linux.md.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libsndio-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOTION_INSTALL_ROMS=${{ inputs.include_roms && 'ON' || 'OFF' }}
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install tree
        run: cmake --install build --prefix dist

      - name: Create archive
        id: archive
        run: |
          NAME="motion-${{ inputs.version }}-${{ matrix.name }}"
          tar -czf "${NAME}.tar.gz" -C dist .
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish to GitHub Releases
    needs: package
    runs-on: ubuntu-24.04
    if: ${{ inputs.publish }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "motion ${{ inputs.version }}" \
            --draft \
            --generate-notes \
            artifacts/*
