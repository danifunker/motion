name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a datestamped release from this build'
        type: boolean
        default: false
      include_roms:
        description: 'Bundle roms/ into the archives (this redistributes SGI firmware)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  # Only cancel superseded PR builds - never kill a release run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-universal
            runner: macos-latest
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # X11 extension packages are NOT optional - SDL aborts configure via
      # SDL_missing_dependency() if any are absent (libxtst-dev in particular).
      # Audio backends do degrade quietly, which makes that easy to misjudge.
      # Canonical list: external/sdl3/docs/README-linux.md
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libsndio-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      # On push/pull_request there is no `inputs` context, so include_roms is
      # null -> falsy -> OFF. Only an explicitly ticked box turns it ON.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOTION_INSTALL_ROMS=${{ inputs.include_roms && 'ON' || 'OFF' }}
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install tree
        run: cmake --install build --prefix "dist/motion-${{ matrix.name }}"

      - name: Show what we produced
        run: |
          ls -lR dist
          file "dist/motion-${{ matrix.name }}/motion"

      # Tar here, not in the release job: upload-artifact does not preserve the
      # executable bit, but a binary inside a tarball survives the round trip.
      - name: Package
        run: tar -czf "motion-${{ matrix.name }}.tar.gz" -C dist "motion-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: motion-${{ matrix.name }}
          path: motion-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: native
    runs-on: ubuntu-24.04

    # The checkbox. Null (and so skipped) on push/pull_request.
    if: ${{ inputs.release }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Once, here - three matrix jobs calling date(1) independently can
      # straddle a minute boundary and disagree.
      - name: Compute datestamp
        id: version
        run: echo "version=v$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Name archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for f in artifacts/*.tar.gz; do
            platform="$(basename "$f" .tar.gz)"
            platform="${platform#motion-}"
            cp "$f" "release/motion-${VERSION}-${platform}.tar.gz"
          done
          # After the final names are settled, so it can't reference a stale one.
          cd release && sha256sum *.tar.gz | tee SHA256SUMS

      # --prerelease because these are rolling datestamped dev builds. Drop it
      # for a normal release, or swap for --draft to approve each one by hand.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "motion $VERSION" \
            --generate-notes \
            --prerelease \
            release/*
